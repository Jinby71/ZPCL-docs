name: ZPCL 文档改进建议
description: 提议新增章节、补充示例或改进 ZPCL 文档站体验
title: "[Docs]: "
labels: [documentation, enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在缺了什么内容，或者哪一段读起来不清楚？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么改
      description: 期望的章节结构、内容要点或示例
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 来完成这项改动
          required: false
